<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Updates — Team ####</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-updates">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <h1>Team ####</h1>
        <span class="brand-subtitle">TOBENAMED</span>
      </div>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="updates.html" class="active">Updates</a>
        <a href="outreach.html">Outreach</a>
        <a href="sponsor.html">Sponsors</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap wrap--updates page-enter">
    <h2 class="page-title" id="updates-page-title">Updates</h2>

    <div class="updates-calendar-full" id="updates-calendar-full">
      <div class="calendar-nav">
        <button type="button" class="calendar-nav-btn" id="cal-prev-month" aria-label="Previous month">‹</button>
        <h3 class="calendar-nav-label" id="cal-month-label">April 2026</h3>
        <button type="button" class="calendar-nav-btn" id="cal-next-month" aria-label="Next month">›</button>
      </div>

      <p class="calendar-hint">Use the arrows or swipe sideways on the calendar to move between months and years.</p>

      <section class="calendar-viewport" id="calendar-viewport">
        <div class="calendar" id="calendar-mount" role="grid" aria-labelledby="updates-page-title cal-month-label"></div>
      </section>
    </div>

    <section class="updates-compact" id="updates-compact" aria-label="Updates list">
      <p class="updates-compact-notice">Your screen cannot support the full calendar.</p>
      <div class="events-swipe-wrap">
        <div class="events-swipe" id="events-swipe" tabindex="0">
          <div class="events-swipe-track" id="events-swipe-track"></div>
        </div>
      </div>
      <p class="events-swipe-hint">Swipe between events.</p>
    </section>
  </main>

  <div class="updates-dock" id="updates-dock">
    <div class="updates-dock-shell">
      <div class="updates-dock-card">
        <div class="updates-dock-surface" id="updates-dock-surface" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer-reveal">
    <p>&copy; 2026 Team ####. All rights reserved.</p>
  </footer>
  <script src="js/footer-reveal.js" defer></script>
  <script src="js/updates-calendar.js" defer></script>
</body>
</html>
